name: Hardware report
description: Tell us how the driver behaves on your card, source and display (working or not).
labels: [hardware-report]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Reports like this build COMPATIBILITY.md. "It works" is just as useful as "it doesn't".
  - type: textarea
    id: lspci
    attributes:
      label: Card IDs
      description: Output of `lspci -nn -d 12ab: -vv | grep -E "12ab|Subsystem"`
      render: text
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: Firmware
      description: Output of `./userspace/hd60pro probe`
      render: text
    validations:
      required: true
  - type: textarea
    id: detect
    attributes:
      label: Input detection
      description: Output of `./userspace/hd60pro -v detect 10` with your source connected
      render: text
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution, kernel (`uname -r`), CPU vendor, IOMMU groups (`ls /sys/kernel/iommu_groups | wc -l`)
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source and mode
      placeholder: e.g. PS5 at 1080p60, or a PC at 1280x720@60
  - type: input
    id: display
    attributes:
      label: Display on HDMI OUT (if any)
  - type: checkboxes
    id: results
    attributes:
      label: What worked
      options:
        - label: Video capture
        - label: Audio capture
        - label: HDMI OUT picture
        - label: HDMI OUT sound
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: What went wrong, error messages, frame rate printed by `run`.
